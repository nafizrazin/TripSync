name: tripsync
services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: runner
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TripSync}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@file_get_contents(\"http://127.0.0.1:8000/up\"); exit($$s===false?1:0);'"]
      interval: 10s
      timeout: 4s
      retries: 18
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./apps/api
    command: php artisan schedule:work
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tripsync}
      POSTGRES_USER: ${DB_USERNAME:-tripsync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripsync_dev_change_me}
    volumes:
      - tripsync_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripsync} -d ${DB_DATABASE:-tripsync}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - tripsync_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  tripsync_pgdata:
  tripsync_redis:
